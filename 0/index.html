<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Project #0</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <main>
        <a class="back-link" href="../index.html">← Back to all projects</a>

        <header>
            <h1>Programming Project #0</h1>
            <h2>Becoming Friends with Your Camera</h2>
        </header>

        <section>
            <h3>Part 1: Selfie: The Wrong Way vs. The Right Way</h3>

            <div class="image-grid">
                <figure>
                    <img src="./media/2x.jpg" alt="Selfie taken with the phone camera at 2x">
                    <figcaption>Phone camera at 2×</figcaption>
                </figure>

                <figure>
                    <img src="./media/1x.jpg" alt="Selfie taken with the phone camera at 1x">
                    <figcaption>Phone camera at 1×</figcaption>
                </figure>
            </div>

            <figure class="single-image">
                <img src="./media/0.5x.jpg" alt="Selfie taken with the phone camera at 0.5x">
                <figcaption>And of course... 0.5×</figcaption>
            </figure>

        </section>

        <section>
            <h3>Part 2: Architectural Perspective Compression</h3>

            <div class="image-grid">
                <figure>
                    <img src="./media/close.jpg" alt="Architecture photographed from close up">
                </figure>

                <figure>
                    <img src="./media/zoom.jpg" alt="Architecture photographed from farther away with zoom">
                </figure>
            </div>

        </section>

        <section>
            <h3>Part 3: The Dolly Zoom</h3>

            <figure class="single-image">
                <img src="./media/IMG_2190.GIF" alt="Dolly zoom animation of a sandwich">
                <figcaption>A close-up of my precious lunch.</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
